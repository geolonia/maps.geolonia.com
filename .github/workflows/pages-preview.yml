name: Build and Deploy preview

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

  workflow_dispatch:

concurrency: preview-${{ github.ref }}

permissions: {}

jobs:
  build-and-deploy:

    # gh-pages ブランチへの push と、プレビューの URL のコメントに使う
    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # デプロイのアクションは token を自分で受け取るので、.git/config に残さない
          persist-credentials: false

      - name: Install and Build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: |
          yarn install --frozen-lockfile
          yarn run lint
          yarn run test
          yarn run build

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./build/
